<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="og-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#387ed1" />
      <stop offset="100%" stopColor="#00d09c" />
    </linearGradient>
    <linearGradient id="og-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0ea5e9" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <filter id="og-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00d09c" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="32" height="32" rx="7" fill="#0c1017" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#1e293b" stroke-width="1" />

  <!-- 3x3 Grid Lines (Subtle) -->
  <line x1="7" y1="16" x2="25" y2="16" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 1.5" />
  <line x1="16" y1="7" x2="16" y2="25" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 1.5" />

  <!-- Outer Hexagonal/Grid Lattice (Stylized O & G) -->
  <path d="M 16 6 L 25 11 L 25 21 L 16 26 L 7 21 L 7 11 Z" 
        stroke="url(#og-grad-primary)" 
        stroke-width="1.8" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Inner Dynamic Grid Cross & Execution Wave -->
  <path d="M 11 16 L 15 12 L 18 17 L 22 13" 
        stroke="url(#og-glow)" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#og-shadow)" />

  <!-- Order Execution Nodes -->
  <circle cx="11" cy="16" r="1.6" fill="#387ed1" />
  <circle cx="15" cy="12" r="1.6" fill="#38bdf8" />
  <circle cx="18" cy="17" r="1.6" fill="#00d09c" />
  <circle cx="22" cy="13" r="2.2" fill="#10b981" />

  <!-- Active Target Ring -->
  <circle cx="22" cy="13" r="3.8" stroke="#00d09c" stroke-width="0.8" stroke-opacity="0.6" stroke-dasharray="1.5 1.5" fill="none" />
</svg>

